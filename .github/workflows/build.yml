name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - platform: iOS Device
            runs-on: macos-14
            xcode: "15.4"
            destination: 'generic/platform=iOS'
            scheme: EmbyVideoPlayerApp
            disable_codesign: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Try multiple Xcode 15.4 paths, fallback to default
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # Check project format version
          grep -i "objectVersion" EmbyVideoPlayer.xcodeproj/project.pbxproj | head -1

      - name: Downgrade Xcode project format for Xcode 15.4 compatibility
        run: |
          # Xcode 15.4 supports up to format ~132 (Xcode 14), but xcodegen generates 77 (Xcode 16+)
          # Manually patch the project format
          sed -i '' 's/objectVersion = 77;/objectVersion = 132;/' EmbyVideoPlayer.xcodeproj/project.pbxproj
          # Also update compatibilityVersion if present
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 15.0";/' EmbyVideoPlayer.xcodeproj/project.pbxproj
          # Verify the change
          grep -i "objectVersion" EmbyVideoPlayer.xcodeproj/project.pbxproj | head -1

      - name: Resolve Swift Package dependencies
        run: swift package resolve

      - name: Build for ${{ matrix.platform }}
        timeout-minutes: 45
        run: |
          xcodebuild \
            -project EmbyVideoPlayer.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=${{ matrix.disable_codesign }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Archive for IPA (iOS Device only)
        if: matrix.platform == 'iOS Device'
        timeout-minutes: 45
        run: |
          xcodebuild archive \
            -project EmbyVideoPlayer.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            -configuration Release \
            -archivePath ./build/EmbyVideoPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          echo "=== Archive Contents Debug ==="
          ls -la ./build/EmbyVideoPlayer.xcarchive/
          find ./build/EmbyVideoPlayer.xcarchive -type f 2>/dev/null | head -50
          echo "=== End Debug ==="

      - name: Create unsigned IPA
        if: matrix.platform == 'iOS Device'
        run: |
          mkdir -p ./build/ipa/Payload
          echo "=== Searching for .app in archive ==="
          find ./build/EmbyVideoPlayer.xcarchive -type f 2>/dev/null | head -50
          # For iOS app bundles, xcodebuild archive puts .app in Products/Applications/
          APP_PATH=$(find ./build/EmbyVideoPlayer.xcarchive/Products/Applications -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in Products/Applications, checking other locations..."
            APP_PATH=$(find ./build/EmbyVideoPlayer.xcarchive -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            echo "Archive structure:"
            find ./build/EmbyVideoPlayer.xcarchive -type d 2>/dev/null | head -40
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" ./build/ipa/Payload/
          cd ./build/ipa
          zip -r EmbyVideoPlayer.ipa Payload/
          echo "Unsigned IPA created at ./build/ipa/EmbyVideoPlayer.ipa"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ github.sha }}
          path: |
            .build
            DerivedData
            build/EmbyVideoPlayer.xcarchive
            build/ipa/EmbyVideoPlayer.ipa
          retention-days: 7
          if-no-files-found: ignore

  swift-format:
    name: SwiftFormat Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Check SwiftFormat
        run: echo "Skipping SwiftFormat check"

  swift-lint:
    name: SwiftLint Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Check SwiftLint
        run: swiftlint lint --config .swiftlint.yml