name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - platform: iOS Device
            runs-on: macos-14
            xcode: "15.4"
            destination: 'generic/platform=iOS'
            scheme: EmbyVideoPlayerApp
            disable_codesign: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Try multiple Xcode 15.4 paths, fallback to default
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package dependencies
        run: swift package resolve

      - name: Build for ${{ matrix.platform }}
        timeout-minutes: 45
        run: |
          xcodebuild \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=${{ matrix.disable_codesign }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Archive for IPA (iOS Device only)
        if: matrix.platform == 'iOS Device'
        timeout-minutes: 45
        run: |
          xcodebuild archive \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            -configuration Release \
            -archivePath ./build/EmbyVideoPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ github.sha }}
          path: |
            .build
            DerivedData
            build/EmbyVideoPlayer.xcarchive
          retention-days: 7
          if-no-files-found: ignore

  swift-format:
    name: SwiftFormat Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Check SwiftFormat
        run: echo "Skipping SwiftFormat check"

  swift-lint:
    name: SwiftLint Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Check SwiftLint
        run: swiftlint lint --config .swiftlint.yml