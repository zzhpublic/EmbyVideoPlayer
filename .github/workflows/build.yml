name: Build and Test

on:
  push:
    branches: [main, master, develop, zzhpublic-literate-engine]
  pull_request:
    branches: [main, master, develop, zzhpublic-literate-engine]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - platform: iOS Device
            runs-on: macos-14
            xcode: "15.4"
            destination: 'generic/platform=iOS'
            scheme: EmbyVideoPlayerApp
            disable_codesign: true
          - platform: tvOS
            runs-on: macos-14
            xcode: "15.4"
            destination: 'generic/platform=tvOS'
            scheme: EmbyVideoPlayerApptvOS
            disable_codesign: true
          - platform: macOS
            runs-on: macos-14
            xcode: "15.4"
            destination: 'platform=macOS'
            scheme: EmbyVideoPlayerMacOS
            disable_codesign: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          # Try multiple Xcode 15.4 paths, fallback to default
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcodegen
        if: runner.os == 'macOS'
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        if: runner.os == 'macOS'
        run: |
          xcodegen generate
          # Check project format version
          grep -i "objectVersion" EmbyVideoPlayer.xcodeproj/project.pbxproj | head -1

      - name: Downgrade Xcode project format for Xcode 15.4 compatibility
        if: runner.os == 'macOS'
        run: |
          # Xcode 15.4 supports down to format ~32 (Xcode 7+), but xcodegen generates 77 (Xcode 16+)
          # Manually patch BOTH objectVersion AND preferredProjectObjectVersion
          sed -i '' 's/objectVersion = 77;/objectVersion = 46;/' EmbyVideoPlayer.xcodeproj/project.pbxproj
          sed -i '' 's/preferredProjectObjectVersion = 77;/preferredProjectObjectVersion = 46;/' EmbyVideoPlayer.xcodeproj/project.pbxproj
          # Also update compatibilityVersion if present
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 8.0";/' EmbyVideoPlayer.xcodeproj/project.pbxproj
          # Verify the changes
          grep -i "objectVersion" EmbyVideoPlayer.xcodeproj/project.pbxproj | head -5
          grep -i "compatibilityVersion" EmbyVideoPlayer.xcodeproj/project.pbxproj | head -5

      - name: Resolve Swift Package dependencies
        run: swift package resolve

      - name: Build for ${{ matrix.platform }}
        timeout-minutes: 45
        run: |
          xcodebuild \
            -project EmbyVideoPlayer.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=${{ matrix.disable_codesign }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Archive for IPA (iOS Device only)
        if: matrix.platform == 'iOS Device'
        timeout-minutes: 45
        run: |
          xcodebuild archive \
            -project EmbyVideoPlayer.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            -configuration Release \
            -archivePath ./build/EmbyVideoPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          echo "=== Archive Contents Debug ==="
          ls -la ./build/EmbyVideoPlayer.xcarchive/
          find ./build/EmbyVideoPlayer.xcarchive -type f 2>/dev/null | head -50
          echo "=== End Debug ==="

      - name: Create unsigned IPA
        if: matrix.platform == 'iOS Device'
        run: |
          mkdir -p ./build/ipa/Payload
          echo "=== Searching for .app in archive ==="
          find ./build/EmbyVideoPlayer.xcarchive -type f 2>/dev/null | head -50
          # For iOS app bundles, xcodebuild archive puts .app in Products/Applications/
          APP_PATH=$(find ./build/EmbyVideoPlayer.xcarchive/Products/Applications -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in Products/Applications, checking other locations..."
            APP_PATH=$(find ./build/EmbyVideoPlayer.xcarchive -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            echo "Archive structure:"
            find ./build/EmbyVideoPlayer.xcarchive -type d 2>/dev/null | head -40
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" ./build/ipa/Payload/
          cd ./build/ipa
          zip -r EmbyVideoPlayer.ipa Payload/
          echo "Unsigned IPA created at ./build/ipa/EmbyVideoPlayer.ipa"

      - name: Archive for tvOS
        if: matrix.platform == 'tvOS'
        timeout-minutes: 45
        run: |
          xcodebuild archive \
            -project EmbyVideoPlayer.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            -configuration Release \
            -archivePath ./build/EmbyVideoPlayertvOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          echo "=== tvOS Archive Contents Debug ==="
          ls -la ./build/EmbyVideoPlayertvOS.xcarchive/
          find ./build/EmbyVideoPlayertvOS.xcarchive -type f 2>/dev/null | head -50
          echo "=== End Debug ==="

      - name: Create tvOS app archive
        if: matrix.platform == 'tvOS'
        run: |
          mkdir -p ./build/tvos
          echo "=== Searching for .app in tvOS archive ==="
          APP_PATH=$(find ./build/EmbyVideoPlayertvOS.xcarchive/Products/Applications -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in Products/Applications, checking other locations..."
            APP_PATH=$(find ./build/EmbyVideoPlayertvOS.xcarchive -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            echo "Archive structure:"
            find ./build/EmbyVideoPlayertvOS.xcarchive -type d 2>/dev/null | head -40
            exit 1
          fi
          echo "Found tvOS app at: $APP_PATH"
          cp -R "$APP_PATH" ./build/tvos/
          cd ./build/tvos
          zip -r EmbyVideoPlayertvOS.zip "$(basename "$APP_PATH")"
          echo "tvOS app archive created at ./build/tvos/EmbyVideoPlayertvOS.zip"

      - name: Archive for macOS
        if: matrix.platform == 'macOS'
        timeout-minutes: 45
        run: |
          xcodebuild archive \
            -project EmbyVideoPlayer.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            -configuration Release \
            -archivePath ./build/EmbyVideoPlayerMacOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          echo "=== macOS Archive Contents Debug ==="
          ls -la ./build/EmbyVideoPlayerMacOS.xcarchive/
          find ./build/EmbyVideoPlayerMacOS.xcarchive -type f 2>/dev/null | head -50
          echo "=== End Debug ==="

      - name: Create macOS app archive
        if: matrix.platform == 'macOS'
        run: |
          mkdir -p ./build/macos
          echo "=== Searching for .app in macOS archive ==="
          APP_PATH=$(find ./build/EmbyVideoPlayerMacOS.xcarchive/Products/Applications -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in Products/Applications, checking other locations..."
            APP_PATH=$(find ./build/EmbyVideoPlayerMacOS.xcarchive -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            echo "Archive structure:"
            find ./build/EmbyVideoPlayerMacOS.xcarchive -type d 2>/dev/null | head -40
            exit 1
          fi
          echo "Found macOS app at: $APP_PATH"
          cp -R "$APP_PATH" ./build/macos/
          cd ./build/macos
          zip -r EmbyVideoPlayerMacOS.zip "$(basename "$APP_PATH")"
          echo "macOS app archive created at ./build/macos/EmbyVideoPlayerMacOS.zip"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ github.sha }}
          path: |
            .build
            DerivedData
            build/EmbyVideoPlayer.xcarchive
            build/ipa/EmbyVideoPlayer.ipa
            build/EmbyVideoPlayertvOS.xcarchive
            build/tvos/EmbyVideoPlayertvOS.zip
            build/EmbyVideoPlayerMacOS.xcarchive
            build/macos/EmbyVideoPlayerMacOS.zip
          retention-days: 7
          if-no-files-found: ignore

  windows-build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "5.10.1"

      - name: Check Swift
        run: swift --version
        shell: pwsh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            %USERPROFILE%\.swiftpm
          key: windows-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            windows-spm-

      - name: Install VLC SDK (Windows)
        run: |
          # Download and install VLC for Windows
          $vlcUrl = "https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.exe"
          $installPath = "C:\Program Files\VideoLAN\VLC"
          Write-Host "Downloading VLC from $vlcUrl"
          Invoke-WebRequest -Uri $vlcUrl -OutFile "vlc-installer.exe"
          Write-Host "Installing VLC to $installPath"
          Start-Process -FilePath "vlc-installer.exe" -ArgumentList "/S", "/D=$installPath" -Wait
          # Verify installation
          if (Test-Path "$installPath\vlc.exe") {
            Write-Host "VLC installed successfully at $installPath"
          } else {
            Write-Error "VLC installation failed"
            exit 1
          }
          
          # Download VLC SDK for Windows (contains headers and libs)
          # Try multiple URLs as they sometimes change
          $sdkUrls = @(
            "https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64-sdk.zip",
            "https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64-sdk.zip"
          )
          $sdkPath = "C:\vlc-sdk"
          $sdkDownloaded = $false
          
          foreach ($sdkUrl in $sdkUrls) {
            try {
              Write-Host "Trying SDK URL: $sdkUrl"
              Invoke-WebRequest -Uri $sdkUrl -OutFile "vlc-sdk.zip" -ErrorAction Stop
              Write-Host "Extracting SDK to $sdkPath"
              Expand-Archive -Path "vlc-sdk.zip" -DestinationPath $sdkPath -Force
              if (Test-Path "$sdkPath\vlc-3.0.21\include\vlc\vlc.h") {
                Write-Host "VLC SDK extracted to $sdkPath"
                $sdkDownloaded = $true
                break
              }
            } catch {
              Write-Warning "Failed to download from ${sdkUrl}: $_"
            }
          }
          
          if (-not $sdkDownloaded) {
            Write-Error "Failed to download VLC SDK from all URLs"
            exit 1
          }
        shell: pwsh

      - name: Set VLC SDK path
        run: |
          echo "VLC_SDK_PATH=C:\vlc-sdk\vlc-3.0.21" >> $env:GITHUB_ENV

      - name: Build Windows executable
        run: |
          swift build -c release --product EmbyVideoPlayerWindows
        env:
          VLC_SDK_PATH: C:\vlc-sdk\vlc-3.0.21

      - name: Package Windows build
        run: |
          $buildDir = "build\windows"
          New-Item -ItemType Directory -Force -Path $buildDir
          Copy-Item -Path ".build\release\EmbyVideoPlayerWindows.exe" -Destination "$buildDir\"
          # Copy VLC DLLs from SDK
          Copy-Item -Path "C:\vlc-sdk\vlc-3.0.21\lib\*.dll" -Destination "$buildDir\" -ErrorAction SilentlyContinue
          # Also copy from VLC installation for runtime
          Copy-Item -Path "C:\Program Files\VideoLAN\VLC\*.dll" -Destination "$buildDir\" -ErrorAction SilentlyContinue
          # Create zip
          Compress-Archive -Path "$buildDir\*" -DestinationPath "$buildDir\EmbyVideoPlayer-Windows.zip"
          Write-Host "Windows build packaged at $buildDir\EmbyVideoPlayer-Windows.zip"
        shell: pwsh

      - name: Upload Windows build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-Windows-${{ github.sha }}
          path: |
            build/windows/EmbyVideoPlayer-Windows.zip
          retention-days: 7
          if-no-files-found: ignore

  swift-format:
    name: SwiftFormat Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Check SwiftFormat
        run: echo "Skipping SwiftFormat check"

  swift-lint:
    name: SwiftLint Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Check SwiftLint
        run: swiftlint lint --config .swiftlint.yml