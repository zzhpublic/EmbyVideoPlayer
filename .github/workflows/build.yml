name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - platform: macOS
                  runs-on: macos-14
            xcode: "15.4"
            destination: 'platform=macOS'
            scheme: EmbyVideoPlayerApp
          - platform: iOS Simulator
                  runs-on: macos-14
            xcode: "15.4"
            destination: 'platform=iOS Simulator,name=iPhone 15,OS=latest'
            scheme: EmbyVideoPlayerApp
          - platform: tvOS Simulator
                  runs-on: macos-14
            xcode: "15.4"
            destination: 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=latest'
            scheme: EmbyVideoPlayerApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Try multiple Xcode 15.4 paths, fallback to default
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package dependencies
        run: swift package resolve

      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            build

      - name: Run tests (macOS only)
        if: matrix.platform == 'macOS'
        run: |
          xcodebuild \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            test

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ github.sha }}
          path: |
            .build
            DerivedData
          retention-days: 7
          if-no-files-found: ignore

  swift-format:
    name: SwiftFormat Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Check SwiftFormat
        run: swiftformat --lint --config .swiftformat . || echo "SwiftFormat found issues"

  swift-lint:
    name: SwiftLint Check
        runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Check SwiftLint
        run: swiftlint lint --config .swiftlint.yml

  generate-docs:
    name: Generate Documentation
        runs-on: macos-14
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          # Try multiple Xcode 15.4 paths, fallback to default
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
      - name: Generate DocC documentation
        run: |
          xcodebuild docbuild \
            -scheme EmbyVideoPlayer \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: DerivedData/Build/Products/Debug/EmbyVideoPlayer.doccarchive
          retention-days: 30