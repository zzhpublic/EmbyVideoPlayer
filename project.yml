name: EmbyVideoPlayer
projectFormatVersion: 46
options:
  bundleIdPrefix: com.emby
  deploymentTarget:
    iOS: "16.0"
    tvOS: "16.0"
    macOS: "13.0"
  minimumXcodeGenVersion: "2.42.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: "7.0.0"
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    version: "4.0.0-a22"

targets:
  EmbyVideoPlayer:
    type: framework
    platform: iOS
    deploymentTarget:
      iOS: "16.0"
      tvOS: "16.0"
      macOS: "13.0"
    sources:
      - path: Sources
    dependencies:
      - package: VLCKit
        product: VLCKit
        condition: "os(iOS) || os(tvOS) || os(macOS)"
      - package: Kingfisher
        product: Kingfisher
        condition: "os(iOS) || os(tvOS) || os(macOS)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emby.videoplayer
        PRODUCT_MODULE_NAME: EmbyVideoPlayer
        INFOPLIST_FILE: App/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) USE_VLCKIT"
    variants:
      tvOS:
        platform: tvOS
      macOS:
        platform: macOS

  EmbyVideoPlayerApp:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "16.0"
      tvOS: "16.0"
    sources:
      - path: App
    resources:
      - path: App/Assets.xcassets
    dependencies:
      - target: EmbyVideoPlayer
      - package: VLCKit
        product: VLCKit
      - package: Kingfisher
        product: Kingfisher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emby.videoplayer
        PRODUCT_MODULE_NAME: EmbyVideoPlayerApp
        INFOPLIST_FILE: App/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) USE_VLCKIT"
    variants:
      tvOS:
        platform: tvOS
      macOS:
        platform: macOS
  
      EmbyVideoPlayerApptvOS:
        type: application
        platform: tvOS
        deploymentTarget:
          tvOS: "16.0"
        sources:
          - path: App
        resources:
          - path: App/Assets.xcassets
        dependencies:
          - target: EmbyVideoPlayer
          - package: VLCKit
            product: VLCKit
          - package: Kingfisher
            product: Kingfisher
        settings:
          base:
            PRODUCT_BUNDLE_IDENTIFIER: com.emby.videoplayer.tvos
            PRODUCT_MODULE_NAME: EmbyVideoPlayerApptvOS
            INFOPLIST_FILE: App/Info.plist
            SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) USE_VLCKIT"
  
      EmbyVideoPlayerMacOS:
    type: application
    platform: macOS
    deploymentTarget:
      macOS: "13.0"
    sources:
      - path: AppMacOS
    resources:
      - path: AppMacOS/Assets.xcassets
    dependencies:
      - target: EmbyVideoPlayer
      - package: VLCKit
        product: VLCKit
      - package: Kingfisher
        product: Kingfisher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emby.videoplayer.macos
        PRODUCT_MODULE_NAME: EmbyVideoPlayerMacOS
        INFOPLIST_FILE: AppMacOS/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) USE_VLCKIT"
